<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubVault - Expenses</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/expenses.css">



    <style>
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-group input,
        .form-group select {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            background: var(--background);
            color: var(--text-main);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.875rem;
            margin-top: 12px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>

<body>
    <div class="app-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">C</div>
                <div class="brand-text">
                    <h2 style="font-size: 1.1rem; font-weight: 700;">ClubVault</h2>
                    <span style="font-size: 0.75rem; color: var(--text-muted);">Finance Portal</span>
                </div>
            </div>

            <nav class="navigation">
                <p class="nav-label">MAIN MENU</p>
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>
                </a>
                <a href="expenses.html" class="nav-item active">
                    <span class="nav-icon">◫</span>
                    <span>Expenses</span>
                </a>
                <a href="reimbursements.html" class="nav-item">
                    <span class="nav-icon">↗</span>
                    <span>Reimbursements</span>
                </a>
                <a href="budget.html" class="nav-item">
                    <span class="nav-icon">◈</span>
                    <span>Budgets</span>
                </a>
                <p class="nav-label">MANAGEMENT</p>
                <a href="settings.html" class="nav-item">
                    <span class="nav-icon">⚙</span>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- NAVBAR -->
            <header class="topbar">
                <div class="breadcrumb" style="font-size: 0.875rem; color: var(--text-muted);">
                    <span>ClubVault</span> <span style="margin: 0 8px;">/</span>
                    <strong style="color: var(--text-main);">Expenses</strong>
                </div>

                <div class="topbar-actions">
                    <button class="topbar-search">
                        <span>⌕</span>
                        <span>Search anything...</span>
                        <kbd
                            style="font-size: 0.65rem; background: var(--border); padding: 2px 6px; border-radius: 4px;">Ctrl
                            K</kbd>
                    </button>

                    <button class="profile-menu">
                        <div class="profile-avatar">TA</div>
                        <div class="profile-details" style="display: flex; flex-direction: column;">
                            <strong style="font-size: 0.875rem;">Tufayl Aiman</strong>
                            <span style="font-size: 0.7rem; color: var(--text-muted);">MMU Cyberjaya</span>
                        </div>
                        <span class="profile-chevron">⌄</span>
                    </button>
                </div>
            </header>

            <div class="content-pad">
                <div class="page-header" style="margin-bottom: 24px;">
                    <h1 style="font-size: 24px; font-weight: 700; color: var(--text-main);">
                        Expense Tracker
                    </h1>
                    <p style="font-size: 0.875rem; color: var(--text-muted);">Log and categorize direct club
                        transactions.</p>
                </div>

                <!-- ADD EXPENSE FORM -->
                <div class="card" style="margin-bottom: 24px;">
                    <div class="section-header" style="margin-bottom: 20px;">
                        <h3 class="section-title">Log New Expense</h3>
                    </div>

                    <form>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Title</label>
                                <input type="text" placeholder="e.g. AWS Subscription">
                            </div>
                            <div class="form-group">
                                <label>Category</label>
                                <select>
                                    <option value="">Select Category</option>
                                    <option value="tech">Software & Tech</option>
                                    <option value="food">Food & Groceries</option>
                                    <option value="events">Events & Workshops</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Amount (RM)</label>
                                <input type="number" step="0.01" placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label>Date</label>
                                <input type="date">
                            </div>
                        </div>
                        <button type="submit" class="btn-submit">Record Expense</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
